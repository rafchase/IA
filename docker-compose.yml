version: "3.9"

services:
  api:
    build:
      context: ./CpfApi
      dockerfile: Dockerfile
    image: cpf-api-csharp:latest
    container_name: cpf-api
    ports:
      - "8080:8080"
    env_file:
      - CpfApi/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
